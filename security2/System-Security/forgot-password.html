<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot Password - CSUCC SafeMart</title>
  <link rel="stylesheet" href="css/forgot-password.css">
  <script src="js/forgot-password.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  <img class="bg-image" src="img/CSUCC-Background.jpg" alt="CSUCC Background">
  <header class="header">
    <div class="container">
      <div class="logo">
        <img src="img/CSUCCSafeMart-logo.png" alt="CSUCC SafeMart logo" />
      </div>
    </div>
  </header>
  
  <main class="page">
    <section class="card">
      <div class="form-header">
        <div class="header-title">
          <i class="bi bi-shield-lock-fill"></i>
          <h1>Forgot Password</h1>
        </div>
        <p class="subtitle">Reset your CSUCC SafeMart password</p>
      </div>

      <div id="step1" class="step-container">
        <form class="form" id="usernameForm" novalidate>
          <div class="form-group">
            <label for="username">ID Number <span class="required">*</span></label>
            <input type="text" id="username" name="username" placeholder="xxxx-xxxx" inputmode="numeric" pattern="\d{4}-\d{4}" required />
            <div class="error-message" id="username-error"></div>
          </div>
          
          <div class="button-group">
            <button type="button" class="button button-secondary" id="cancelBtn1">Cancel</button>
            <button type="submit" class="button button-primary">
              <i class="bi bi-arrow-right-circle"></i> Continue
            </button>
          </div>
        </form>
      </div>

      <div id="step2" class="step-container" style="display: none;">
        <form class="form" id="verifyForm" novalidate>
          <input type="hidden" id="hidden_username" name="username" />

          <div class="user-info" id="user-info" style="display: none;">
            <div class="info-group">
              <label>ID Number:</label>
              <span id="id-number-display"></span>
            </div>
            <div class="info-group">
              <label>Username:</label>
              <span id="username-display"></span>
            </div>
          </div>

          <div class="section-title">
            <i class="bi bi-shield-lock-fill"></i> Authentication Questions
          </div>
          <p class="info-text">To verify your identity, please answer the security questions you selected during registration.</p>

          <!-- QUESTION 1 -->
          <div class="auth-row">
            <div class="auth-row-header">
              <label for="question1_text">Question 1 <span class="required">*</span></label>
              <label for="answer1">Your Answer <span class="required">*</span></label>
              <label for="answer1_confirm">Re-enter Answer <span class="required">*</span></label>
            </div>
            <div class="auth-row-divider"></div>
            <div class="auth-row-fields">
              <div class="auth-field">
                <input type="text" id="question1_text" class="question-display auth-control" readonly />
                <input type="hidden" id="question1" name="auth_question1" />
              </div>
              <div class="auth-field">
                <div class="input-with-toggle">
                  <input type="password" id="answer1" name="auth_answer1" class="auth-control" required />
                  <button type="button" class="toggle-password" id="answer1-toggle" aria-label="Show answer" title="Show answer">
                    <i class="bi bi-eye-fill" id="answer1-toggle-icon"></i>
                  </button>
                </div>
                <div class="error-message" id="answer1-error"></div>
              </div>
              <div class="auth-field">
                <div class="input-with-toggle">
                  <input type="password" id="answer1_confirm" name="auth_answer1_confirm" class="auth-control" required />
                  <button type="button" class="toggle-password" id="answer1-confirm-toggle" aria-label="Show answer" title="Show answer">
                    <i class="bi bi-eye-fill" id="answer1-confirm-toggle-icon"></i>
                  </button>
                </div>
                <div class="error-message" id="answer1-confirm-error"></div>
              </div>
            </div>
          </div>

          <!-- QUESTION 2 -->
          <div class="auth-row">
            <div class="auth-row-header">
              <label for="question2_text">Question 2 <span class="required">*</span></label>
              <label for="answer2">Your Answer <span class="required">*</span></label>
              <label for="answer2_confirm">Re-enter Answer <span class="required">*</span></label>
            </div>
            <div class="auth-row-divider"></div>
            <div class="auth-row-fields">
              <div class="auth-field">
                <input type="text" id="question2_text" class="question-display auth-control" readonly />
                <input type="hidden" id="question2" name="auth_question2" />
              </div>
              <div class="auth-field">
                <div class="input-with-toggle">
                  <input type="password" id="answer2" name="auth_answer2" class="auth-control" required />
                  <button type="button" class="toggle-password" id="answer2-toggle" aria-label="Show answer" title="Show answer">
                    <i class="bi bi-eye-fill" id="answer2-toggle-icon"></i>
                  </button>
                </div>
                <div class="error-message" id="answer2-error"></div>
              </div>
              <div class="auth-field">
                <div class="input-with-toggle">
                  <input type="password" id="answer2_confirm" name="auth_answer2_confirm" class="auth-control" required />
                  <button type="button" class="toggle-password" id="answer2-confirm-toggle" aria-label="Show answer" title="Show answer">
                    <i class="bi bi-eye-fill" id="answer2-confirm-toggle-icon"></i>
                  </button>
                </div>
                <div class="error-message" id="answer2-confirm-error"></div>
              </div>
            </div>
          </div>

          <!-- QUESTION 3 -->
          <div class="auth-row">
            <div class="auth-row-header">
              <label for="question3_text">Question 3 <span class="required">*</span></label>
              <label for="answer3">Your Answer <span class="required">*</span></label>
              <label for="answer3_confirm">Re-enter Answer <span class="required">*</span></label>
            </div>
            <div class="auth-row-divider"></div>
            <div class="auth-row-fields">
              <div class="auth-field">
                <input type="text" id="question3_text" class="question-display auth-control" readonly />
                <input type="hidden" id="question3" name="auth_question3" />
              </div>
              <div class="auth-field">
                <div class="input-with-toggle">
                  <input type="password" id="answer3" name="auth_answer3" class="auth-control" required />
                  <button type="button" class="toggle-password" id="answer3-toggle" aria-label="Show answer" title="Show answer">
                    <i class="bi bi-eye-fill" id="answer3-toggle-icon"></i>
                  </button>
                </div>
                <div class="error-message" id="answer3-error"></div>
              </div>
              <div class="auth-field">
                <div class="input-with-toggle">
                  <input type="password" id="answer3_confirm" name="auth_answer3_confirm" class="auth-control" required />
                  <button type="button" class="toggle-password" id="answer3-confirm-toggle" aria-label="Show answer" title="Show answer">
                    <i class="bi bi-eye-fill" id="answer3-confirm-toggle-icon"></i>
                  </button>
                </div>
                <div class="error-message" id="answer3-confirm-error"></div>
              </div>
            </div>
          </div>

          <div class="error-message" id="form-error"></div>

          <div class="button-group">
            <button type="button" class="button button-secondary" id="cancelBtn2">Cancel</button>
            <button type="submit" class="button button-primary">
              <i class="bi bi-check-circle"></i> Verify Identity
            </button>
          </div>
        </form>
      </div>
    </section>
  </main>
  
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2025 CSUCC SafeMart. All rights reserved. A secure marketplace for the CSUCC community.</p>
      </div>
    </div>
  </footer>
</body>
</html>
