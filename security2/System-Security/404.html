<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-container {
            text-align: left;
            max-width: 600px;
            padding: 20px;
        }

        .error-content {
            display: flex;
            align-items: center;
            gap: 30px;
            position: relative;
        }

        .circle-bg {
            position: absolute;
            width: 380px;
            height: 380px;
            background: linear-gradient(135deg, #e8eef5 0%, #f0f4f8 100%);
            border-radius: 50%;
            left: -80px;
            top: 50%;
            transform: translateY(-50%);
            z-index: -1;
        }

        .sad-face {
            width: 140px;
            height: 140px;
            border: 3px solid #2c3e50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: transparent;
            flex-shrink: 0;
        }

        .eyes {
            position: absolute;
            top: 45px;
            display: flex;
            gap: 25px;
        }

        .eye {
            width: 12px;
            height: 12px;
            background-color: #2c3e50;
            border-radius: 50%;
        }

        .mouth {
            position: absolute;
            bottom: 45px;
            width: 50px;
            height: 3px;
            background-color: #2c3e50;
        }

        .error-text {
            margin-left: 20px;
        }

        .error-code {
            font-size: 80px;
            font-weight: 700;
            color: #2c3e50;
            line-height: 1;
            margin: 0;
            letter-spacing: -2px;
        }

        .error-title {
            font-size: 22px;
            font-weight: 600;
            color: #2c3e50;
            margin: 10px 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .error-message {
            font-size: 15px;
            color: #95a5a6;
            line-height: 1.6;
            margin-bottom: 25px;
            max-width: 380px;
        }

        @media (max-width: 768px) {
            .error-content {
                flex-direction: column;
                text-align: center;
            }

            .error-text {
                margin-left: 0;
            }

            .circle-bg {
                width: 280px;
                height: 280px;
                left: 50%;
                transform: translate(-50%, -50%);
            }

            .error-code {
                font-size: 60px;
            }

            .error-title {
                font-size: 18px;
            }

            .error-message {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <div class="circle-bg"></div>
            
            <div class="sad-face">
                <div class="eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div class="mouth"></div>
            </div>

            <div class="error-text">
                <h1 class="error-code">404</h1>
                <h2 class="error-title">OOPS! PAGE NOT FOUND</h2>
                <p class="error-message">
                    Sorry but the page or resource you're trying to access is not available or does not exist.
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
