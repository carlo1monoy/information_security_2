<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #0c1f14;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0e0e0;
        }
        
        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 500px;
            border: 1px solid #2d5a3d;
            border-radius: 4px;
            background: rgba(18, 35, 24, 0.7);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        .error-code {
            font-size: 100px;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #e0e0e0;
            letter-spacing: 1px;
        }
        
        p {
            font-size: 16px;
            line-height: 1.5;
            color: #b0b0b0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>PAGE NOT FOUND</h1>
        <p>The page or resource you're trying to access is not available or does not exist.</p>
    </div>
</body>
</html>
