<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Change Password - CSUCC SafeMart</title>
  <link rel="stylesheet" href="css/change-password.css">
  <script src="js/change-password.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  <img class="bg-image" src="img/CSUCC-Background.jpg" alt="CSUCC Background">
  <header class="header">
    <div class="container">
      <div class="logo">
        <img src="img/CSUCCSafeMart-logo.png" alt="CSUCC SafeMart logo" />
      </div>
    </div>
  </header>
  
  <main class="page">
    <section class="card">
      <div class="form-header">
        <div class="header-title">
          <i class="bi bi-key-fill"></i>
          <h1>Change Password</h1>
        </div>
        <p class="subtitle">Update your CSUCC SafeMart password</p>
      </div>

      <div class="user-info" id="user-info" style="display: none;">
        <div class="info-group">
          <label>ID Number:</label>
          <span id="user-id-display"></span>
        </div>
        <div class="info-group">
          <label>Username:</label>
          <span id="username-display"></span>
        </div>
      </div>

      <form class="form" id="changePasswordForm" action="php/change-password.php" method="POST" novalidate>
        <div class="form-group">
          <label for="password">New Password <span class="required">*</span></label>
          <div class="input-with-toggle">
            <input type="password" id="password" name="password" required />
            <button type="button" class="toggle-password" id="password-toggle" aria-label="Show password" title="Show password">
              <i class="bi bi-eye-fill" id="password-toggle-icon"></i>
            </button>
          </div>
          <div class="password-strength-container" id="password-strength-container" style="display: none">
            <div class="password-strength-bar">
              <div class="strength-segment"></div>
              <div class="strength-segment"></div>
              <div class="strength-segment"></div>
            </div>
            <div class="password-strength-label" id="password-strength-label"></div>
          </div>
          <div class="error-message" id="password-error"></div>
        </div>
        
        <div class="form-group">
          <label for="password2">Confirm Password <span class="required">*</span></label>
          <div class="input-with-toggle">
            <input type="password" id="password2" name="password2" required />
            <button type="button" class="toggle-password" id="password2-toggle" aria-label="Show password" title="Show password">
              <i class="bi bi-eye-fill" id="password2-toggle-icon"></i>
            </button>
          </div>
          <div class="password-match-container" id="password-match-container" style="display: none">
            <div class="password-match-bar">
              <div class="match-segment"></div>
              <div class="match-segment"></div>
              <div class="match-segment"></div>
            </div>
            <div class="password-match-label" id="password-match-label"></div>
          </div>
          <div class="error-message" id="password2-error"></div>
        </div>

        <div class="error-message" id="form-error"></div>
        <div class="success-message" id="success-message" style="display: none;"></div>
        
        <button type="submit" class="button">Change Password</button>
        
      </form>
    </section>
  </main>
  
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2025 CSUCC SafeMart. All rights reserved. A secure marketplace for the CSUCC community.</p>
      </div>
    </div>
  </footer>
</body>
</html>
